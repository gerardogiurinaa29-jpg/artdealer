b.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(M);}catch(e){const t=document.createElement("textarea");t.value=M;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();}b.textContent="✅ Copiato! Ora incollalo su WhatsApp";b.className="ok";});}</script></body></html>
